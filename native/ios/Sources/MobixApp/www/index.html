<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mobix</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #0b0b0f; color: #f5f5f7; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p { color: #a1a1aa; margin: 0 0 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    button { flex: 1 1 140px; padding: 12px; border-radius: 10px; border: 1px solid #3f3f46; background: #18181b; color: inherit; font-size: 0.95rem; }
    button:active { background: #27272a; }
    pre { min-height: 120px; padding: 12px; border-radius: 10px; background: #18181b; border: 1px solid #27272a; overflow: auto; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>Mobix runtime</h1>
  <p>Native bridge smoke test. Replace this page with your built web app (`mobix sync`).</p>
  <div class="row">
    <button id="device">Device info</button>
    <button id="storage">Storage round-trip</button>
  </div>
  <pre id="output">Ready.</pre>
  <script>
    const output = document.getElementById('output');
    let counter = 0;
    window.__mobixReceive = function (payload) {
      output.textContent = JSON.stringify(JSON.parse(payload), null, 2);
    };
    function call(plugin, method, params) {
      const id = 'demo-' + (++counter);
      window.mobixBridge.postMessage(JSON.stringify({ v: 1, id, plugin, method, params: params || {} }));
    }
    document.getElementById('device').onclick = function () { call('Device', 'getInfo'); };
    document.getElementById('storage').onclick = function () {
      call('Storage', 'set', { key: 'demo.value', value: 'stored-' + Date.now() });
      setTimeout(function () { call('Storage', 'get', { key: 'demo.value' }); }, 150);
    };
  </script>
</body>
</html>
