name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal reproduction and commands.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mobix version
      placeholder: 0.9.0-beta.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: OS, Node, Android/iOS SDK, and sanitized logs. Do not share secrets.
