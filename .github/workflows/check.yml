name: Node
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install SDK dependencies
        run: npm ci --prefix packages/core
      - name: Install CLI dependencies
        run: npm ci --prefix packages/cli
      - name: Build and test packages
        run: npm run check
      - name: Check npm package contents
        run: npm run release:dry-run

      - name: Install and build packed starter
        run: npm run verify:starter
